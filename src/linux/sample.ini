; Screen Lighting Control. Save as ~/.config/slc/slc.ini, then run: slc reload
; SLC never writes to this file. Everything here is optional; these are the defaults.

[general]
kelvin=6500             ; warmth when the schedule is off

[schedule]
enabled=1
mode=sun                ; sun (sunrise and sunset of your city) or fixed
city=                   ; find it with: slc cities <name>
;lat=52.52              ; coordinates win over the city
;lon=13.40
wake=07:00              ; night colors start 9 hours before this
day_k=6500
evening_k=3400
night_k=2700
sunset_minutes=40       ; how long the changes take
sunrise_minutes=60
fixed_day=07:00         ; used by mode=fixed, or while there is no location
fixed_evening=19:00
;night_brightness=60    ; upper limit for brightness at night

; One section per display, named by connector or description (see: slc status)
;[monitor.DP-1]
;enabled=1
;hw_share=50            ; part of the brightness range done by the real backlight

; Your own scenes replace the built-in ones
[scene.Daylight]
brightness=100
kelvin=6500

[scene.Reading]
brightness=80
kelvin=4200

[scene.Evening]
brightness=60
kelvin=3400

[scene.Night]
brightness=35
kelvin=2700
